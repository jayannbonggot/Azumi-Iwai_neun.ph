<style>
  :root{
    --ink:#F4F3F7;
    --ink-dim:#9A97A6;
    --black:#08070A;
    --black-2:#0B0A0E;
    --line: rgba(244,243,247,0.14);
    --c1:#5B4FE8;
    --c2:#E23F86;
    --c3:#FF8A56;
    --c4:#4FE0D2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--black);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 16px;
  }

  .stage{ width:100%; max-width: 560px; display:flex; flex-direction:column; align-items:center; gap:18px; }

  /* ---------- top controls ---------- */
  .toprow{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:10px;
  }

  .lang-toggle{
    display:flex;
    align-items:center;
    gap:8px;
    border:1px solid var(--line);
    background: rgba(255,255,255,0.03);
    border-radius: 999px;
    padding: 7px 8px 7px 14px;
    cursor:pointer;
    color: var(--ink);
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    -webkit-tap-highlight-color: transparent;
    transition: border-color .2s ease, background .2s ease;
  }
  .lang-toggle:hover{ border-color: rgba(244,243,247,0.32); background: rgba(255,255,255,0.06); }
  .lang-toggle .pill-icon{
    width:26px; height:26px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(140deg, var(--c1), var(--c2) 45%, var(--c4));
    transition: transform .5s cubic-bezier(.4,0,.2,1);
  }
  .lang-toggle .pill-icon svg{ width:13px; height:13px; stroke:#08070A; }
  .lang-toggle.spin .pill-icon{ transform: rotate(180deg); }

  /* ---------- flip card ---------- */
  .flip-wrap{
    width:100%;
    aspect-ratio: 1.75 / 1;
    perspective: 1800px;
  }
  .flip-inner{
    position:relative;
    width:100%; height:100%;
    transition: transform .8s cubic-bezier(.4,0,.2,1);
    transform-style: preserve-3d;
  }
  .flip-inner.flipped{ transform: rotateY(180deg); }

  .face{
    position:absolute; inset:0;
    backface-visibility:hidden;
    border-radius: 16px;
    overflow:hidden;
    border:1px solid var(--line);

    flex-direction:column;
    justify-content:space-between;
    min-width:0;
  }

  .name-block .kicker{
    font-family:'IBM Plex Mono', monospace;
    font-size: clamp(8px, 1.6vw, 10px);
    letter-spacing:.14em;
    text-transform:uppercase;
    color: var(--ink-dim);
    margin: 0 0 6px;
  }

  .name-en{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size: clamp(22px, 6.4vw, 40px);
    line-height:0.98;
    letter-spacing:-0.01em;
    margin:0;
  }
  .role-en{
    font-family:'Space Grotesk', sans-serif;
    font-weight:500;
    font-size: clamp(11px, 2.6vw, 17px);
    color: var(--ink-dim);
    margin: 6px 0 0;
  }

  .name-jp{
    font-family:'M PLUS Rounded 1c', sans-serif;
    font-weight:800;
    font-size: clamp(24px, 7vw, 42px);
    line-height:1;
    margin:0;
  }
  .role-jp{
    font-family:'Noto Sans JP', sans-serif;
    font-weight:500;
    font-size: clamp(11px, 2.6vw, 16px);
    color: var(--ink-dim);
    margin: 8px 0 0;
  }

  .contact-block{ display:flex; flex-direction:column; gap:2px; }
  .contact-block a{
    font-family:'Space Grotesk', sans-serif;
    font-weight:500;
    font-size: clamp(11px, 2.6vw, 16px);
    color: var(--ink);
    text-decoration:none;
    width: fit-content;
    padding: 1px 2px;
    border-radius: 4px;
    transition: opacity .2s ease;
  }
  .contact-block a:hover{ opacity:0.68; }

  /* ---------- edit mode ---------- */
  [contenteditable="true"]{
    outline: 1px dashed rgba(79,224,210,0.6);
    outline-offset: 3px;
    border-radius: 4px;
    cursor: text;
  }
  [contenteditable="true"]:focus{
    outline: 1px solid var(--c4);
    background: rgba(79,224,210,0.08);
  }
  .edit-hint{
    width:100%;
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color: var(--ink-dim);
    letter-spacing:.03em;
    margin: -6px 0 0;
    opacity:0;
    max-height:0;
    overflow:hidden;
    transition: opacity .2s ease;
  }
  .edit-hint.show{ opacity:1; max-height:40px; margin-top:0; }

  .right-col{
    flex:none;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    justify-content:flex-end;
    gap: 10px;
    margin-right: -20px;
    margin-bottom: -30px;
  }

  .brand-link{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    text-decoration:none;
    -webkit-tap-highlight-color: transparent;
  }
  .brand-link .lockup{
    width: clamp(140px, 38vw, 240px);
    height:auto;
    transition: transform .35s ease, filter .3s ease;
  }
  .brand-link:hover .lockup{ transform: scale(1.05); filter: drop-shadow(0 0 10px rgba(244,243,247,.35)); }

  /* ---------- save button ---------- */
  .save-btn{
    width:100%;
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding:15px 16px; border-radius:12px; border:none;
    background: linear-gradient(100deg, var(--c1), var(--c2) 35%, var(--c3) 65%, var(--c4));
    color:#08070A;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700; font-size:15px; letter-spacing:.01em;
    cursor:pointer;
    transition: filter .2s ease, transform .15s ease;
  }
  .save-btn:hover{ filter:brightness(1.08); }
  .save-btn:active{ transform: scale(0.98); }
  .save-btn svg{ width:17px; height:17px; }

  .toast{
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:.06em; color: var(--c4);
    height: 16px; opacity:0;
    transition: opacity .25s ease;
  }
  .toast.show{ opacity:1; }

  .bottom-controls{ width:100%; }

  @media (prefers-reduced-motion: reduce){
    .flip-inner, .brand-link .mark, .save-btn, .lang-toggle .pill-icon{ transition:none !important; }
  }
</style>
</head>

  <div class="bottom-controls">
    <button class="save-btn" id="saveBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
      <span id="saveLabel">Save Contact</span>
    </button>
    <p class="toast" id="toast">Saved — check your downloads</p>
    <p class="edit-hint" id="editHint">Editing on — click any text to change it. Changes save automatically in this browser.</p>
  </div>

</div>

<script>
  const flipInner = document.getElementById('flipInner');
  const langToggle = document.getElementById('langToggle');
  const langLabel = document.getElementById('langLabel');
  const editToggle = document.getElementById('editToggle');
  const editLabel = document.getElementById('editLabel');
  const editHint = document.getElementById('editHint');
  const saveBtn = document.getElementById('saveBtn');
  const saveLabel = document.getElementById('saveLabel');
  const toast = document.getElementById('toast');

  let isJapanese = false;
  let isEditing = false;

  const STORAGE_KEY = 'nf-card-data-v1';
  const editableIds = ['kicker-en','name-en','role-en','phone-en','email-en','kicker-jp','name-jp','role-jp','phone-jp','email-jp'];

  function loadSaved(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return;
      const data = JSON.parse(raw);
      editableIds.forEach(id => {
        if(data[id] !== undefined){
          const el = document.getElementById(id);
          if(el) el.textContent = data[id];
        }
      });
    }catch(e){ /* ignore corrupt/missing storage */ }
  }

  function persist(){
    const data = {};
    editableIds.forEach(id => {
      const el = document.getElementById(id);
      if(el) data[id] = el.textContent.trim();
    });
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){ /* storage unavailable */ }
  }

  function syncLinks(){
    const phoneEn = document.getElementById('phone-en');
    const phoneJp = document.getElementById('phone-jp');
    const emailEn = document.getElementById('email-en');
    const emailJp = document.getElementById('email-jp');

    const digits = phoneEn.textContent.replace(/[^\d+]/g, '');
    phoneEn.href = 'tel:' + digits;
    phoneJp.href = 'tel:' + phoneJp.textContent.replace(/[^\d+]/g, '');

    emailEn.href = 'mailto:' + emailEn.textContent.trim();
    emailJp.href = 'mailto:' + emailJp.textContent.trim();
  }

  loadSaved();
  syncLinks();

  langToggle.addEventListener('click', () => {
    isJapanese = !isJapanese;
    flipInner.classList.toggle('flipped', isJapanese);
    langToggle.classList.toggle('spin');
    langLabel.textContent = isJapanese ? 'ENGLISH' : '日本語';
    saveLabel.textContent = isJapanese ? '連絡先を保存' : 'Save Contact';
  });

  editToggle.addEventListener('click', () => {
    if(!isEditing){const p=prompt('Enter password to edit:'); if(p!=='N3un_F@rb3n/2013-09-27'){alert('Incorrect password'); return;}}

    isEditing = !isEditing;
    editToggle.classList.toggle('spin', isEditing);
    editLabel.textContent = isEditing ? 'Done' : 'Edit';
    editHint.classList.toggle('show', isEditing);

    editableIds.forEach(id => {
      const el = document.getElementById(id);
      if(!el) return;
      el.setAttribute('contenteditable', isEditing ? 'true' : 'false');
    });

    if(!isEditing){
      syncLinks();
      persist();
    }
  });

  editableIds.forEach(id => {
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('blur', () => { syncLinks(); persist(); });
    el.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){ e.preventDefault(); el.blur(); }
    });
  });

  saveBtn.addEventListener('click', () => {
    const get = id => document.getElementById(id).textContent.trim();

    const vcard = isJapanese ? [
      'BEGIN:VCARD',
      'VERSION:3.0',
      'N:' + get('name-jp') + ';;;;',
      'FN:' + get('name-jp'),
      'ORG:' + get('kicker-jp'),
      'TITLE:' + get('role-jp'),
      'TEL;TYPE=CELL:' + get('phone-jp').replace(/[^\d+]/g, ''),
      'EMAIL;TYPE=INTERNET:' + get('email-jp'),
      'URL:https://neun.ph',
      'END:VCARD'
    ].join('\r\n') : [
      'BEGIN:VCARD',
      'VERSION:3.0',
      'N:' + get('name-en').split(' ').reverse().join(';') + ';;;',
      'FN:' + get('name-en'),
      'ORG:' + get('kicker-en'),
      'TITLE:' + get('role-en'),
      'TEL;TYPE=CELL:' + get('phone-en').replace(/[^\d+]/g, ''),
      'EMAIL;TYPE=INTERNET:' + get('email-en'),
      'URL:https://neun.ph',
      'END:VCARD'
    ].join('\r\n');

    const blob = new Blob([vcard], { type: 'text/vcard' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = get('name-en').replace(/\s+/g, '_') + '.vcf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    toast.textContent = isJapanese ? '保存しました — ダウンロードをご確認ください' : 'Saved — check your downloads';
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2600);
  });
</script>
